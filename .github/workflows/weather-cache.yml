# 全島の天気を Open-Meteo から取得し docs/weather/ を更新する。
# 成功時のみ main に push → GitHub Pages（/docs）で配信。
name: 天気キャッシュ更新

on:
  schedule:
    # JST 毎時 :17 と :47（1日48回）。片方が欠けても次の枠で拾う。
    # :00/:30 付近の Actions 混雑と Open-Meteo の :00 更新を避ける。
    # さらに欠ける場合は weather-cache-watchdog が自動再トリガーする。
    - cron: "17 * * * *"
      timezone: "Asia/Tokyo"
    - cron: "47 * * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-cache
  cancel-in-progress: false

jobs:
  update-weather-cache:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 天気キャッシュを取得・生成
        run: python3 scripts/fetch_weather_cache.py

      - name: 更新失敗を明示する
        if: failure()
        run: |
          echo "::error::天気キャッシュの更新に失敗しました。docs/weather は前回の配信を維持しています。ログを確認し、必要なら workflow_dispatch で再実行してください。"

      - name: 変更があれば commit して push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/weather/
          if git diff --staged --quiet; then
            echo "変更なし — commit をスキップします"
          else
            git commit -m "天気キャッシュを更新する"
            git push
          fi
