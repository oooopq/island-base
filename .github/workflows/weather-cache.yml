# 全島の天気を Open-Meteo から取得し docs/weather/ を更新する。
# 成功時のみ main に push → GitHub Pages（/docs）で配信。
name: 天気キャッシュ更新

on:
  schedule:
    # Open-Meteo 更新（:00 JST）との競合を避け、毎時 10 分（JST）に実行
    - cron: "10 * * * *"
      timezone: Asia/Tokyo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-cache
  cancel-in-progress: false

jobs:
  update-weather-cache:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 天気キャッシュを取得・生成
        run: python3 scripts/fetch_weather_cache.py

      - name: 変更があれば commit して push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/weather/
          if git diff --staged --quiet; then
            echo "変更なし — commit をスキップします"
          else
            git commit -m "天気キャッシュを更新する"
            git push
          fi
